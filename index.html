<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:transparent;font-size:14px}
:root{--acc:#1D9E75;--acc-l:#E1F5EE;--acc-d:#085041;--warn:#BA7517;--warn-l:#FAEEDA;--dan:#A32D2D;--dan-l:#FCEBEB;--abs-c:#7B4FBF;--abs-l:#F0EAFB}

/* SAVE ZONE - très visible */
.savezone{background:#FFF3E0;border:3px solid #FF6F00;padding:14px 16px;position:sticky;top:0;z-index:50}
.savezone-title{font-size:13px;font-weight:700;color:#E65100;margin-bottom:8px}
.savezone-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
#json-box{width:100%;height:80px;font-size:10px;font-family:monospace;background:#fff;border:2px solid #FF6F00;border-radius:6px;padding:8px;resize:vertical;color:#333;line-height:1.4;cursor:text}
#copy-ok{font-size:12px;color:#2D6B1A;font-weight:700;display:none}

.topbar{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--color-border-tertiary);background:var(--color-background-primary);flex-wrap:wrap}
.topbar h1{font-size:14px;font-weight:600;color:var(--color-text-primary)}
.sp{flex:1}
.trim-sel{display:flex;gap:2px;background:var(--color-background-secondary);border:1px solid var(--color-border-secondary);border-radius:8px;padding:3px}
.tbtn{font-size:12px;font-weight:600;padding:4px 14px;border-radius:6px;cursor:pointer;border:none;background:transparent;color:var(--color-text-secondary);font-family:var(--font-sans)}
.tbtn.on{background:var(--color-background-primary);color:var(--acc);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.btn{font-size:12px;padding:7px 13px;border-radius:8px;border:1px solid var(--color-border-secondary);cursor:pointer;background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-weight:500}
.btn:hover{background:var(--color-background-secondary)}
.btn.green{background:#1D9E75;color:#fff;border-color:#1D9E75}
.btn.green:hover{opacity:.88}
.btn.orange{background:#FF6F00;color:#fff;border-color:#FF6F00;font-size:13px;padding:8px 16px}
.btn.orange:hover{opacity:.88}
.btn.blue{background:#185FA5;color:#fff;border-color:#185FA5}
.btn.red{background:#A32D2D;color:#fff;border-color:#A32D2D}
.btn:disabled{opacity:.4;cursor:not-allowed}

.stats-bar{display:flex;gap:10px;padding:6px 16px;background:var(--color-background-secondary);border-bottom:1px solid var(--color-border-tertiary);flex-wrap:wrap;align-items:center}
.stats-bar span{font-size:11px;color:var(--color-text-secondary)}
.stats-bar strong{color:var(--color-text-primary)}
.search-wrap{padding:9px 16px;background:var(--color-background-primary);border-bottom:1px solid var(--color-border-tertiary)}
.search-wrap input{width:100%;height:32px;padding:0 11px;font-size:13px;border-radius:8px;border:1px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary)}
.content{padding:14px 16px;background:var(--color-background-tertiary);min-height:400px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:10px}
.card{background:var(--color-background-primary);border:1px solid var(--color-border-tertiary);border-radius:12px;padding:12px;cursor:pointer;transition:border-color .15s;position:relative}
.card:hover{border-color:var(--acc)}
.cname{font-size:13px;font-weight:600;color:var(--color-text-primary);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnom{font-size:11px;color:var(--color-text-secondary);margin-bottom:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px}
.slbl{font-size:11px;color:var(--color-text-secondary)}
.pill{font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px}
.pill.good{background:var(--acc-l);color:var(--acc-d)}
.pill.mid{background:var(--warn-l);color:var(--warn)}
.pill.low{background:var(--dan-l);color:var(--dan)}
.pill.none{background:var(--color-background-secondary);color:var(--color-text-tertiary)}
.pbar{height:3px;background:var(--color-background-secondary);border-radius:2px;overflow:hidden;margin-top:7px}
.pbar .fill{height:100%;background:var(--acc);border-radius:2px}
.absbadge{position:absolute;top:8px;right:8px;font-size:9px;font-weight:700;padding:2px 5px;border-radius:6px;background:var(--abs-l);color:var(--abs-c)}
.detail{display:flex;flex-direction:column;gap:12px}
.back{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--color-text-secondary);cursor:pointer;padding:5px 0;width:fit-content;font-weight:500}
.back:hover{color:var(--color-text-primary)}
.sheader{background:var(--color-background-primary);border:1px solid var(--color-border-tertiary);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--acc-l);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:var(--acc-d);flex-shrink:0}
.summaries{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sum{background:var(--color-background-primary);border:1px solid var(--color-border-tertiary);border-radius:10px;padding:12px;text-align:center}
.sum .lbl{font-size:11px;color:var(--color-text-secondary);margin-bottom:4px}
.sum .val{font-size:22px;font-weight:700}
.sum .mx{font-size:11px;color:var(--color-text-tertiary)}
.branch{background:var(--color-background-primary);border:1px solid var(--color-border-tertiary);border-radius:12px;overflow:hidden}
.bhead{display:flex;align-items:center;gap:9px;padding:12px 15px;border-bottom:1px solid var(--color-border-tertiary);cursor:pointer;user-select:none}
.btitle{font-size:13px;font-weight:600;color:var(--color-text-primary);flex:1}
.bmoy{font-size:12px;font-weight:600;padding:3px 10px;border-radius:10px}
.chev{font-size:15px;color:var(--color-text-secondary);transition:transform .2s}
.bbody{padding:12px 15px}
.sg{border:1px solid var(--color-border-tertiary);border-radius:10px;margin-bottom:10px;overflow:hidden}
.sg:last-child{margin-bottom:0}
.sghead{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--color-background-secondary);border-bottom:1px solid var(--color-border-tertiary)}
.sglbl{font-size:12px;font-weight:600;color:var(--color-text-primary);flex:1}
.sgmoy{font-size:11px;font-weight:600;padding:2px 8px;border-radius:8px}
.nebtn{font-size:11px;padding:2px 8px;border-radius:8px;cursor:pointer;border:1px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);font-family:var(--font-sans);font-weight:500}
.nebtn.on{background:var(--warn-l);color:var(--warn);border-color:var(--warn)}
.sgbody{padding:10px 12px}
.ecard{background:var(--color-background-secondary);border:1px solid var(--color-border-tertiary);border-radius:10px;margin-bottom:8px;overflow:hidden}
.ecard-top{display:flex;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap}
.ecard-lbl{flex:1;min-width:100px}
.ecard-lbl input{width:100%;height:30px;padding:0 8px;font-size:12px;border-radius:7px;border:1px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans)}
.ecard-score{display:flex;align-items:center;gap:6px;flex-shrink:0}
.score-sel{font-size:13px;font-weight:700;height:32px;padding:0 6px;border-radius:7px;border:1px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans);min-width:62px}
.max-sel{font-size:12px;height:32px;padding:0 5px;border-radius:7px;border:1px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-secondary);font-family:var(--font-sans);min-width:58px}
.sep{font-size:12px;color:var(--color-text-tertiary);font-weight:600}
.contrib{font-size:10px;color:var(--color-text-tertiary);background:var(--color-background-primary);padding:2px 6px;border-radius:5px;white-space:nowrap}
.ecard-actions{display:flex;gap:4px;flex-shrink:0}
.sm{font-size:11px;padding:3px 8px;border-radius:6px;cursor:pointer;border:1px solid var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);font-family:var(--font-sans);white-space:nowrap;font-weight:500}
.sm:hover{background:var(--color-background-primary)}
.sm.del:hover{background:var(--dan-l);color:var(--dan);border-color:var(--dan)}
.sm.on{background:var(--acc-l);color:var(--acc-d);border-color:var(--acc)}
.ecard-detail{padding:10px 12px;border-top:1px solid var(--color-border-tertiary);background:var(--color-background-primary);display:flex;flex-direction:column;gap:8px}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.flag{font-size:11px;padding:3px 9px;border-radius:7px;border:1px solid var(--color-border-secondary);cursor:pointer;font-weight:500;color:var(--color-text-secondary)}
.flag:hover{background:var(--color-background-secondary)}
.flag.on{border-color:var(--warn);background:var(--warn-l);color:var(--warn)}
.flag.abs-f.on{border-color:var(--abs-c);background:var(--abs-l);color:var(--abs-c)}
.note-area textarea{width:100%;min-height:46px;font-size:12px;padding:6px 8px;border-radius:7px;border:1px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-primary);font-family:var(--font-sans);resize:vertical;line-height:1.5}
.note-area label{font-size:11px;font-weight:600;color:var(--color-text-secondary);margin-bottom:3px;display:block}
.repond-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.repond-row label{font-size:11px;font-weight:600;color:var(--warn)}
.repond-row select{font-size:12px;height:28px;padding:0 5px;border-radius:7px;border:1px solid rgba(186,117,23,.4);background:var(--warn-l);color:var(--color-text-primary);font-family:var(--font-sans)}
.addbtn{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--acc);cursor:pointer;padding:4px 0;margin-top:4px;font-weight:600}
.compsec{background:var(--color-background-primary);border:1px solid var(--color-border-tertiary);border-radius:12px;overflow:hidden}
.clvl{font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px}
.clvl.ok{background:#EDF5E8;color:#2D6B1A}
.clvl.warn{background:#FDF3E7;color:#B85C00}
.clvl.danger{background:#FDF0EC;color:#C8391A}
.clvl.ticket{background:#FDE8E4;color:#8B1A0A}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ccard{border-radius:10px;padding:10px 12px;border:1px solid}
.ccard.bad{background:#FDF0EC;border-color:rgba(200,57,26,.15)}
.ccard.good{background:#EDF5E8;border-color:rgba(45,107,26,.15)}
.ccard h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.ccard.bad h4{color:#C8391A}
.ccard.good h4{color:#2D6B1A}
.citem{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.citem:last-child{border-bottom:none}
.citemlbl{font-size:11px;color:var(--color-text-secondary);flex:1}
.citemct{font-size:12px;font-weight:700;min-width:20px;text-align:right}
.citemct.bad{color:#C8391A}
.citemct.good{color:#2D6B1A}
.hitem{display:flex;gap:8px;align-items:center;font-size:12px;padding:3px 0;border-bottom:1px solid var(--color-border-tertiary)}
.hitem:last-child{border-bottom:none}
.hdate{font-size:10px;color:var(--color-text-tertiary);min-width:65px;font-family:monospace}
.hlbl{flex:1}
.hdelta{font-size:11px;padding:1px 6px;border-radius:5px}
.hdelta.bad{background:#FDF0EC;color:#C8391A}
.hdelta.good{background:#EDF5E8;color:#2D6B1A}
.csec{background:var(--color-background-primary);border:1px solid var(--color-border-tertiary);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.genbtn{display:flex;align-items:center;gap:7px;font-size:13px;padding:8px 16px;border-radius:8px;background:var(--acc);color:#fff;border:none;cursor:pointer;font-family:var(--font-sans);font-weight:600}
.genbtn:hover{opacity:.85}
.genbtn:disabled{opacity:.5;cursor:not-allowed}
.gcom{background:var(--acc-l);border:1px solid rgba(29,158,117,.3);border-radius:10px;padding:14px;font-size:13px;color:var(--color-text-primary);line-height:1.75;white-space:pre-wrap}
.printsec{background:var(--color-background-primary);border:1px solid var(--color-border-tertiary);border-radius:12px;padding:14px}
.printpre{font-size:11px;line-height:1.8;border:1px dashed var(--color-border-secondary);padding:12px;border-radius:8px;background:var(--color-background-secondary);white-space:pre-wrap;font-family:monospace}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#ffffff;border-radius:14px;padding:18px;width:100%;max-width:560px;height:auto;max-height:calc(100vh - 40px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 50px rgba(0,0,0,.5);position:relative;z-index:10000}
.modal h2{font-size:15px;font-weight:700;color:#111}
.mf{display:flex;flex-direction:column;gap:5px}
.mf label{font-size:12px;font-weight:600;color:#555}
.mf input,.mf select,.mf textarea{font-size:13px;padding:8px 11px;border-radius:8px;border:1px solid #ccc;background:#f5f5f5;color:#111;font-family:var(--font-sans);width:100%}
.mf textarea{min-height:140px;resize:vertical;line-height:1.6}
.mf .hint{font-size:11px;color:var(--color-text-tertiary);line-height:1.5}
.mrow{display:flex;gap:10px}
.mrow .mf{flex:1}
.mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.pprev{background:#f0f0f0;border-radius:8px;padding:10px;font-size:12px;line-height:1.7;max-height:140px;overflow-y:auto;border:1px solid #ccc;color:#111}
.prow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 0;border-bottom:1px solid var(--color-border-tertiary)}
.prow:last-child{border-bottom:none}
.pname{color:var(--color-text-secondary);font-size:11px;flex:1}
.pval{font-weight:600}
.pabs{color:var(--abs-c);font-size:11px;background:var(--abs-l);padding:1px 6px;border-radius:6px}
.perr{color:var(--dan);font-size:11px}
.ldots{display:inline-flex;gap:4px;align-items:center}
.ldots span{width:5px;height:5px;border-radius:50%;background:var(--acc);animation:dot .8s infinite}
.ldots span:nth-child(2){animation-delay:.15s}
.ldots span:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
@media print {
  body { background: white !important; font-size: 11px; }
  .savezone, .topbar, .stats-bar, .search-wrap, .overlay, #print-modal { display: none !important; }
  .print-page { page-break-after: always; padding: 16px; }
  .print-page:last-child { page-break-after: avoid; }
  .print-header { border-bottom: 2px solid #1D9E75; margin-bottom: 10px; padding-bottom: 8px; }
  .print-name { font-size: 16px; font-weight: 700; }
  .print-moys { display: flex; gap: 20px; margin: 8px 0; }
  .print-moy { text-align: center; }
  .print-moy .val { font-size: 20px; font-weight: 700; }
  .print-moy .lbl { font-size: 10px; color: #666; }
  .print-comment { margin-top: 8px; font-size: 11px; line-height: 1.6; border: 1px solid #ddd; padding: 8px; border-radius: 6px; background: #f9f9f9; }
  .print-section { margin-top: 8px; }
  .print-section h4 { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #666; margin-bottom: 4px; }
  .print-row { display: flex; justify-content: space-between; font-size: 10px; padding: 2px 0; border-bottom: 1px solid #f0f0f0; }
}
#print-modal { display: none; }

.sectitle{font-size:11px;font-weight:700;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.sectitle.mt{margin-top:12px}
.alertbar{border-radius:10px;padding:9px 13px;font-size:12px;display:flex;align-items:center;gap:7px;background:var(--abs-l);border:1px solid rgba(123,79,191,.3);color:var(--abs-c)}
.eval-mgr{border-radius:12px;overflow:hidden;border:1px solid var(--color-border-tertiary);margin:10px 16px;background:var(--color-background-primary)}
.eval-mgr-head{padding:12px 16px;background:var(--color-background-secondary);border-bottom:1px solid var(--color-border-tertiary);display:flex;align-items:center;gap:8px}
.eval-mgr-head h3{font-size:13px;font-weight:700;flex:1}
.eval-item{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid var(--color-border-tertiary);font-size:12px}
.eval-item:last-child{border-bottom:none}
.eval-item .elbl{flex:1;font-weight:600}
.eval-item .edomain{font-size:11px;color:var(--color-text-secondary)}
#file-imp,#file-comp{display:none}
/* Modale sauvegarde */
.save-modal{background:#ffffff;border-radius:14px;padding:22px;width:100%;max-width:650px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 50px rgba(0,0,0,.5);position:relative;z-index:10000}
.save-modal h2{font-size:15px;font-weight:700;color:#E65100}
.save-modal textarea{width:100%;height:300px;font-size:11px;font-family:monospace;background:#fff;border:2px solid #FF6F00;border-radius:8px;padding:10px;resize:vertical;color:#333;line-height:1.4}
</style>
</head>
<body>
<input type="file" id="file-imp" accept=".json">
<input type="file" id="file-comp" accept=".json">
<div id="root"></div>

function scoreOpts(max,cur){
  const m=parseFloat(max)||10;
  const all=new Set();
  for(let v=0;v<=m;v+=0.5)all.add(Math.round(v*10)/10);
  if(cur!==""&&cur!==undefined&&!isNaN(parseFloat(cur)))all.add(parseFloat(cur));
  return[...all].sort((a,b)=>a-b).map(v=>`<option value="${v}" ${parseFloat(cur)===v?"selected":""}>${v}</option>`).join("");
}

// ── CALCULS ───────────────────────────────────────────────────────
function cPool(ev,t){
  if(!ev||!ev.length)return null;
  const v=ev.filter(e=>!e.abs&&e.pts!==""&&e.pts!==undefined&&parseFloat(e.max)>0);
  if(!v.length)return null;
  const hasR=v.some(e=>e.wt!=null&&e.wt!=="");
  if(hasR){let sc=0,sw=0;v.forEach(e=>{const w=e.wt!=null&&e.wt!==""?parseFloat(e.wt):parseFloat(e.max);sc+=parseFloat(e.pts)/parseFloat(e.max)*w;sw+=w;});return sw?sc/sw*t:null;}
  const sp=v.reduce((a,e)=>a+parseFloat(e.pts),0),sm=v.reduce((a,e)=>a+parseFloat(e.max),0);
  return sm?sp/sm*t:null;
}
function cSE(s){const ne=s.fr._ne||{};let sum=0,max=0;["dictees","grammaire","analyse","conjugaison","expression","vocabulaire"].forEach(id=>{if(ne["se_"+id])return;const v=cPool(s.fr.se[id]||[],10);if(v!==null){sum+=v;max+=10;}});return max?sum/max*60:null;}
function cNb(s){return s.math._ne?.["nop_nombres"]?null:cPool(s.math.nop.nombres||[],20);}
function cOp(s){return s.math._ne?.["nop_operations"]?null:cPool(s.math.nop.operations||[],30);}
function cBr(s,br){
  let ss=0,sm=0;
  if(br==="fr"){const ne=s.fr._ne||{};const se=cSE(s);if(se!==null){ss+=se;sm+=60;}[{id:"sl",t:20},{id:"sp",t:10},{id:"sec",t:10}].forEach(({id,t})=>{if(ne[id])return;const v=cPool(s.fr[id]||[],t);if(v!==null){ss+=v;sm+=t;}});}
  else if(br==="math"){const nb=cNb(s),op=cOp(s);let ns=0,nm=0;if(nb!==null){ns+=nb;nm+=20;}if(op!==null){ns+=op;nm+=30;}if(nm>0){ss+=ns/nm*50;sm+=50;}const ne=s.math._ne||{};[{id:"grandeurs",t:20},{id:"solides",t:20},{id:"traitement",t:10}].forEach(({id,t})=>{if(ne[id])return;const v=cPool(s.math[id]||[],t);if(v!==null){ss+=v;sm+=t;}});}
  else{const ne=s.eveil._ne||{};[{id:"histoire",t:10},{id:"geo",t:10},{id:"sciences",t:10}].forEach(({id,t})=>{if(ne[id])return;const v=cPool(s.eveil[id]||[],t);if(v!==null){ss+=v;sm+=t;}});if(!sm)return null;return ss/sm*100;}
  return sm?ss/sm*100:null;
}
function aR(k){const s=gS(k);let tot=0,abs=0;const ps=[...["dictees","grammaire","analyse","conjugaison","expression","vocabulaire"].map(id=>s.fr.se[id]||[]),s.fr.sl||[],s.fr.sp||[],s.fr.sec||[],s.math.nop.nombres||[],s.math.nop.operations||[],s.math.grandeurs||[],s.math.solides||[],s.math.traitement||[],s.eveil.histoire||[],s.eveil.geo||[],s.eveil.sciences||[]];ps.forEach(p=>p.forEach(e=>{tot++;if(e.abs)abs++;}));return tot?abs/tot:0;}
function sc(v){return v===null?"none":v>=65?"good":v>=50?"mid":"low";}
function fmt(v,d=1){if(v===null||v===undefined)return"—";return parseFloat(v.toFixed(d)).toString();}
function ini(st){return[st.prenom[0]||"",st.nom[0]||""].join("").toUpperCase();}
function cv(v){return v===null?"var(--color-text-tertiary)":v>=65?"var(--acc)":v>=50?"var(--warn)":"var(--dan)";}
function cpair(v){if(v===null)return["var(--color-background-secondary)","var(--color-text-secondary)"];if(v>=65)return["#E1F5EE","#0F6E56"];if(v>=50)return["#FAEEDA","#BA7517"];return["#FCEBEB","#A32D2D"];}

// Gestionnaire évals
function getAllEvals(){const map={};STUDENTS.forEach(st=>{const s=gS(KEY(st));POOLS.forEach(p=>{const pool=gP(s,p.br,p.gid,p.sid)||[];pool.forEach(e=>{const k=(e.label||"")+"|||"+p.lbl;if(!map[k])map[k]={label:e.label||"",domain:p.lbl,count:0,max:e.max};map[k].count++;});});});return Object.values(map);}
function delEvalGlobal(label,poolLbl){if(!confirm(`Supprimer "${label||"?"}" (${poolLbl}) chez TOUS les élèves ?`))return;const p=POOLS.find(p=>p.lbl===poolLbl);if(!p)return;STUDENTS.forEach(st=>{const s=gS(KEY(st));const pool=gP(s,p.br,p.gid,p.sid);for(let i=pool.length-1;i>=0;i--){if(pool[i].label===label)pool.splice(i,1);}});updateJSON();render();}

function openModal(){M={open:true,title:"",pi:0,max:"10",useR:false,wt:"",raw:"",parsed:null};render();}
function closeModal(){M.open=false;render();}
function parsePaste(){if(!M.raw.trim()){M.parsed=null;return;}const lines=M.raw.split(/[\n\r]+/).map(l=>l.trim()).filter(l=>l!=="");M.parsed=STUDENTS.map((st,i)=>{const line=lines[i]||"",up=line.toUpperCase().replace(/\s/g,"");if(up==="ABS"||up==="A"||up==="-")return{st,abs:true,pts:null,err:false};const n=parseFloat(line.replace(",","."));if(isNaN(n)||n<0)return{st,abs:false,pts:null,err:true,raw:line};return{st,abs:false,pts:n,err:false};});}
function applyEval(){
  if(!M.parsed||!M.title.trim())return;
  const p=POOLS[M.pi];
  if(M.parsed.some(r=>r.err)&&!confirm("Valeurs non reconnues ignorées. Continuer ?"))return;
  STUDENTS.forEach((st,i)=>{const k=KEY(st),s=gS(k),row=M.parsed[i];if(!row||row.err)return;const e={label:M.title.trim(),pts:row.abs?"":row.pts,max:parseFloat(M.max)||10,abs:row.abs};if(M.useR&&M.wt!=="")e.wt=parseFloat(M.wt);gP(s,p.br,p.gid,p.sid).push(e);});
  updateJSON();M.open=false;render();
  // Ouvre automatiquement la modale de sauvegarde
  setTimeout(()=>{openSaveModal();},300);
}
function openMV(br,gid,sid,idx){MV={open:true,br,gid,sid,idx,toIdx:0};render();}
function closeMV(){MV.open=false;render();}
function applyMV(){const s=gS(state.cur);const pool=gP(s,MV.br,MV.gid,MV.sid);const ev=pool.splice(MV.idx,1)[0];gP(s,POOLS[MV.toIdx].br,POOLS[MV.toIdx].gid,POOLS[MV.toIdx].sid).push(ev);updateJSON();MV.open=false;render();}

            <span class="sep">/</span>

          <button class="sm${isOpen?" on":""}" onclick="togOpen('${br}','${gid}',${SS},${i})">⚙</button>

  SL ${ne("fr").sl?"[N.E.]":f(cPool(s.fr.sl||[],20))}/20 · SP ${ne("fr").sp?"[N.E.]":f(cPool(s.fr.sp||[],10))}/10 · SÉc ${ne("fr").sec?"[N.E.]":f(cPool(s.fr.sec||[],10))}/10
MATHS: ${f(mt)}/100
  N&O ${n50} (Nb ${ne("math")["nop_nombres"]?"[N.E.]":f(nb)+fs(s.math.nop.nombres)}/20 · Op ${ne("math")["nop_operations"]?"[N.E.]":f(op2)+fs(s.math.nop.operations)}/30)
  Grand ${ne("math").grandeurs?"[N.E.]":f(cPool(s.math.grandeurs||[],20))}/20 · Sol ${ne("math").solides?"[N.E.]":f(cPool(s.math.solides||[],20))}/20 · Trait ${ne("math").traitement?"[N.E.]":f(cPool(s.math.traitement||[],10))}/10
ÉVEIL: ${f(ev)}/100
  Hist ${ne("eveil").histoire?"[N.E.]":f(cPool(s.eveil.histoire||[],10))}/10 · Géo ${ne("eveil").geo?"[N.E.]":f(cPool(s.eveil.geo||[],10))}/10 · Sci ${ne("eveil").sciences?"[N.E.]":f(cPool(s.eveil.sciences||[],10))}/10
COMPORTEMENT: ${cLbF(st.cp)} (${d?d.bad.reduce((a,b)=>a+b,0):"-"} nég · ${d?d.good.reduce((a,b)=>a+b,0):"-"} pos)${san?.tickets?.length?" 🎫"+san.tickets.length:""}
COMMENTAIRE:
${s.commentaire||"(à générer)"}`;
}

function printAllPDF(){
  // Ouvrir une nouvelle fenêtre avec tous les bulletins formatés pour impression
  const w = window.open('', '_blank');
  const f=(v,t)=>v!==null?fmt(v)+'/'+t:'—';
  const ne=b=>gS(STUDENTS[0].cp||'')&&false; // dummy
  
  let pages = STUDENTS.map(st => {
    const s = gS(KEY(st));
    const fr = cBr(s,'fr'), mt = cBr(s,'math'), ev = cBr(s,'eveil');
    const se60 = cSE(s), nb = cNb(s), op2 = cOp(s);
    const nFr = b => s[b]._ne||{};
    const fv = (v,t) => v!==null ? fmt(v)+'/'+t : '—';
    const comment = s.commentaire || '(pas de commentaire)';
    
    // Moys
    const moyFr = fr!==null?fmt(fr)+'/100':'—';
    const moyMa = mt!==null?fmt(mt)+'/100':'—';
    const moyEv = ev!==null?fmt(ev)+'/100':'—';
    
    // Comportement
    const cd = gC(st.cp);
    const compStr = cd ? cLbF(st.cp) : 'Non disponible';
    
    return \`<div class="print-page">
      <div class="print-header">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div class="print-name">\${st.prenom} \${st.nom}</div>
            <div style="font-size:11px;color:#666">Bulletin P5 — La Providence · \${TLBL[state.trim]} \${state.annee}</div>
          </div>
          <div style="text-align:right;font-size:11px;color:#666">Comportement : <strong>\${compStr}</strong></div>
        </div>
      </div>
      <div class="print-moys">
        <div class="print-moy"><div class="val" style="color:\${fr>=65?'#1D9E75':fr>=50?'#BA7517':'#A32D2D'}">\${moyFr}</div><div class="lbl">Français</div></div>
        <div class="print-moy"><div class="val" style="color:\${mt>=65?'#1D9E75':mt>=50?'#BA7517':'#A32D2D'}">\${moyMa}</div><div class="lbl">Maths</div></div>
        <div class="print-moy"><div class="val" style="color:\${ev>=65?'#1D9E75':ev>=50?'#BA7517':'#A32D2D'}">\${moyEv}</div><div class="lbl">Éveil</div></div>
      </div>
      <div class="print-comment">\${comment.replace(/\n/g,'<br>')}</div>
      <div class="print-section">
        <h4>Français (SE: \${fv(se60,60)})</h4>
        \${[
          ['Dictées',cPool(s.fr.se.dictees||[],10),10,'fr','se_dictees'],
          ['Grammaire',cPool(s.fr.se.grammaire||[],10),10,'fr','se_grammaire'],
          ['Analyse',cPool(s.fr.se.analyse||[],10),10,'fr','se_analyse'],
          ['Conjugaison',cPool(s.fr.se.conjugaison||[],10),10,'fr','se_conjugaison'],
          ['Expression',cPool(s.fr.se.expression||[],10),10,'fr','se_expression'],
          ['Vocabulaire',cPool(s.fr.se.vocabulaire||[],10),10,'fr','se_vocabulaire'],
          ['Lecture',cPool(s.fr.sl||[],20),20,'fr','sl'],
          ['Écoute',cPool(s.fr.sec||[],10),10,'fr','sec'],
        ].filter(([l,v,t,br,nk])=>!s[br]._ne?.[nk]&&v!==null).map(([l,v,t])=>
          \`<div class="print-row"><span>\${l}</span><span style="font-weight:600">\${fv(v,t)}</span></div>\`
        ).join('')}
      </div>
      <div class="print-section">
        <h4>Mathématiques</h4>
        \${[
          ['Nombres',nb,20],['Opérations',op2,30],
          ['Grandeurs',cPool(s.math.grandeurs||[],20),20],
          ['Solides',cPool(s.math.solides||[],20),20],
          ['Traitement',cPool(s.math.traitement||[],10),10],
        ].filter(([l,v])=>v!==null).map(([l,v,t])=>
          \`<div class="print-row"><span>\${l}</span><span style="font-weight:600">\${fv(v,t)}</span></div>\`
        ).join('')}
      </div>
      <div class="print-section">
        <h4>Éveil</h4>
        \${[
          ['Histoire',cPool(s.eveil.histoire||[],10),10],
          ['Géographie',cPool(s.eveil.geo||[],10),10],
          ['Sciences',cPool(s.eveil.sciences||[],10),10],
        ].filter(([l,v])=>v!==null).map(([l,v,t])=>
          \`<div class="print-row"><span>\${l}</span><span style="font-weight:600">\${fv(v,t)}</span></div>\`
        ).join('')}
      </div>
    </div>\`;
  }).join('');
  
  w.document.write(\`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Bulletins P5 \${state.annee}</title><style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
    body{background:white;color:#111}
    .print-page{page-break-after:always;padding:20px;max-width:800px;margin:0 auto;border-bottom:3px solid #eee}
    .print-page:last-child{page-break-after:avoid;border-bottom:none}
    .print-header{border-bottom:2px solid #1D9E75;margin-bottom:10px;padding-bottom:8px}
    .print-name{font-size:18px;font-weight:700}
    .print-moys{display:flex;gap:30px;margin:10px 0;padding:10px;background:#f9f9f9;border-radius:8px}
    .print-moy{text-align:center}
    .print-moy .val{font-size:22px;font-weight:700}
    .print-moy .lbl{font-size:11px;color:#666}
    .print-comment{margin:10px 0;font-size:12px;line-height:1.7;border:1px solid #ddd;padding:10px;border-radius:6px;background:#f9f9f9;white-space:pre-wrap}
    .print-section{margin-top:10px}
    .print-section h4{font-size:11px;font-weight:700;text-transform:uppercase;color:#666;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid #eee}
    .print-row{display:flex;justify-content:space-between;font-size:11px;padding:3px 4px;border-bottom:1px solid #f5f5f5}
    .print-row:last-child{border-bottom:none}
    @media print{.print-page{border-bottom:none}}
    .no-print{text-align:center;padding:20px;background:#1D9E75;color:white}
    .no-print button{background:white;color:#1D9E75;border:none;padding:10px 24px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;margin:0 8px}
    @media print{.no-print{display:none}}
  </style></head><body>
  <div class="no-print">
    <button onclick="window.print()">🖨️ Imprimer / Enregistrer en PDF</button>
    <button onclick="window.close()">✕ Fermer</button>
  </div>
  \${pages}
  </body></html>\`);
  w.document.close();
}


render();
</script>
</body></html>
